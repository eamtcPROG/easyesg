allowBuilds:
  # next-intl's native file watcher, a non-optional dependency. Allowed: it is a real native
  # build, and next-intl declares it rather than treating it as optional.
  '@parcel/watcher': true
  # TypeORM's install-time analytics beacon. Denied: it is telemetry, not a build the
  # package needs, and it phones out from every CI run and every developer install.
  '@scarf/scarf': false
  # Host for next-intl-swc-plugin-extractor, next-intl's message extractor. Allowed: same
  # reasoning as @parcel/watcher — a declared, non-optional native compiler binary.
  '@swc/core': true
  # Native accelerator for msgpackr, BullMQ's serialiser. Allowed: it is a real native
  # build, and without it msgpackr silently falls back to slower pure JS.
  'msgpackr-extract': true
  # Native module resolver used by the ESLint import plugin. Allowed: same reasoning.
  'unrs-resolver': true

# Peer mismatches warn rather than fail (strictPeerDependencies defaults to false).
# Each silenced pair is justified here; never blanket-applied.
peerDependencyRules:
  allowedVersions:
    # §12.1 pins ioredis 6.0.0 (for BullMQ 6.0.9) and TypeORM 1.1.0, whose ioredis peer
    # range is ^5.0.4 — the two pins are internally inconsistent. It is inert: the peer is
    # declared optional, and TypeORM reaches for ioredis in exactly one place,
    # cache/RedisQueryResultCache.js. This design never enables TypeORM's query-result
    # cache — AD-4 invalidates by version poll, AD-5's entitlement cache is in-process, and
    # Redis is never a system of record (AD-10). If anyone ever sets `cache: {type:"redis"}`
    # on a DataSource, this entry is the thing that was hiding an untested combination.
    "typeorm>ioredis": "6.0.0"
    # §12.1 pins ESLint 10.8.1; eslint-plugin-jsx-a11y 6.10.2 still declares a peer range
    # ending at ^9. Verified 18 Aug 2026 by loading the plugin under 10.8.1 and asserting
    # jsx-a11y/alt-text fires: the range is stale metadata, not an incompatibility. Unlike the
    # entry above, a real break here would be loud — ESLint throws at lint time on a removed
    # API rather than silently taking an untested path — so the exposure is a failed `pnpm
    # lint`, not a defect that ships. Revisit when the plugin declares 10.
    "eslint-plugin-jsx-a11y>eslint": "10.8.1"
    # §12.1 pins TypeScript 6.0.3 (AD-13); openapi-typescript 7.13.0 declares ^5.x, a range
    # that predates TS 6. TS 6 retains the TS 5 compiler API — that is AD-13's whole ground
    # for staying on 6 rather than 7 — and generation was verified against 6.0.3 on
    # 20 Aug 2026 (task 20): `pnpm --filter @easyesg/contracts generate` emits and the
    # emitted file typechecks. A real break would be loud — a failed generate in the
    # openapi:check gate — not a defect that ships. Revisit when the tool declares 6.
    "openapi-typescript>typescript": "6.0.3"
