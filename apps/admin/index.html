<!doctype html>
<html lang="ro" data-density="compact">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      The console is never public. `edge` already restricts it by IP allowlist (§10.2) and it
      sits behind mandatory MFA (NFR-65); this is the belt-and-braces half of the same rule.
    -->
    <meta name="robots" content="noindex, nofollow" />
    <!--
      The favicon set, from the design handoff of 11 Sep 2026. Vite has no metadata API — `public/`
      is copied to `dist/` verbatim and every tag is written by hand here, which is the whole of the
      difference from `apps/web`, where the same assets are declared through `metadata.icons` on the
      root layout. The hrefs are root-absolute because that is how Vite serves `public/` in dev and
      in the built bundle alike.

      **No `<link rel="manifest">`, and no PWA icons in `public/favicon/`.** A manifest exists to make
      an app installable to a home screen, and this one is reachable only from an IP allowlist
      (§10.2) behind mandatory MFA (NFR-65) and is `noindex` above — so the three 192/512 PNGs the
      handoff ships for that purpose would be bytes in the bundle that nothing can ever request.

      `color` on the mask icon is `--pine-600`, the single accent. Safari draws the pinned-tab glyph
      from the SVG's silhouette and takes the colour from this attribute, so it cannot be read from
      the token the way every other surface reads it.
    -->
    <link rel="icon" href="/favicon/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon/favicon-32.png" sizes="32x32" />
    <link rel="icon" href="/favicon/favicon-16.png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png" />
    <link rel="mask-icon" href="/favicon/safari-pinned-tab.svg" color="#2E6A4F" />
    <!-- The browser chrome, in each scheme since task 152 (UX-80): `--accent` as light and dark resolve it —
         `--pine-600`, `--pine-dark-400` — restated because a <meta> cannot read a custom property. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#2E6A4F" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#58B085" />
    <!--
      A product name, not copy — the one string here that is not a message key. Everything a
      person reads inside the app resolves through the catalogue (FR-61, FR-62); a sentence in
      this file would need a release to change, which is what NFR-85 forbids.
    -->
    <title>easyesg</title>
  </head>
  <body class="t-body">
    <!--
      Task 153 (§12.5.6's task-153 row, NFR-81): the console renders nothing until its script runs, so with scripting
      off a browser would show a blank page — a silent failure. This is the explicit one. **A literal here, not a
      catalogue key**: the catalogue is loaded by the script this sentence exists for the absence of, and the console
      is Romanian-only (OQ-42). NFR-79's three parts: what happened, so what, what now.
    -->
    <noscript>
      <p>Consola de administrare are nevoie de JavaScript. Fără el nu se poate afișa nimic, nici autentificarea.
        Activați JavaScript în setările browserului, apoi reîncărcați pagina.</p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/app/entry/main.tsx"></script>
  </body>
</html>
