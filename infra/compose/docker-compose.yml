# Local development dependencies — PostgreSQL and Redis, and since task 44 the renderer and the object storage the
# worker's PDF export calls.
#
# architecture.md §12.5.10: the Compose stack IS the development environment. No service and
# no service client is installed on a developer host, which needs Node, pnpm, Docker and git
# and nothing else. Reach a client through its container:
#
#     docker compose exec postgres psql -U esg_app esg
#
# The applications themselves run on the host (`pnpm --filter @easyesg/api start:dev`), which
# keeps hot reload. §12.5.10 permits that explicitly — it bans installing a *service or its
# client*, not Node. Building app images is a separate unit: there is no Dockerfile yet.
#
# This is the base file. `docker-compose.prod.yml` drops `postgres` at the launch stage, when
# the primary moves to VM-2 (§10.4); `redis` stays on VM-1 in every file (§10.2).
name: easyesg

services:
  postgres:
    image: postgres:18.4
    container_name: easyesg-postgres
    restart: unless-stopped
    # An init process is PID 1, not the postmaster (architecture.md §12.5.10). A process started
    # inside the container whose parent dies there — a healthcheck probe's child when Docker kills
    # the probe at its timeout, or a `docker compose exec` — is reparented to PID 1, and PostgreSQL
    # 18's postmaster treats any such "untracked child process" exiting with a status other than 0
    # or 1 as a crashed backend: every connection dropped and the server reinitialised. A
    # `pg_isready` orphan exiting 2 under host load did exactly that. docker-init reaps orphans and
    # forwards the image's SIGINT, so shutdown is unchanged.
    init: true
    environment:
      # The image superuser. Deliberately NOT esg_app: §7.6 requires the application role to
      # be non-superuser and non-BYPASSRLS, and a dev database where the app connects as
      # superuser makes every future RLS probe pass for the wrong reason.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/compose/.env}
      POSTGRES_DB: esg
      # Read by init/init.sh. Declared here or the script cannot see them.
      ESG_APP_PASSWORD: ${ESG_APP_PASSWORD:?set ESG_APP_PASSWORD in infra/compose/.env}
      ESG_WORKER_PASSWORD: ${ESG_WORKER_PASSWORD:?set ESG_WORKER_PASSWORD in infra/compose/.env}
      ESG_ADMIN_RO_PASSWORD: ${ESG_ADMIN_RO_PASSWORD:?set ESG_ADMIN_RO_PASSWORD in infra/compose/.env}
      ESG_MIGRATOR_PASSWORD: ${ESG_MIGRATOR_PASSWORD:?set ESG_MIGRATOR_PASSWORD in infra/compose/.env}
      # A subdirectory, so the volume mount point is not itself the data directory.
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs only against a *fresh* data directory — an existing pgdata volume never sees it.
      # init.sh is therefore idempotent and runnable by hand; see its header.
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1 forces TCP, and that is the whole point. During initdb the official
      # entrypoint runs a temporary server on the unix socket ONLY, so a socket-based
      # pg_isready reports healthy before the init scripts have run — a false positive that
      # lets a dependent service race a half-built cluster.
      #
      # $$ escapes Compose's own interpolation so the container shell expands the variable.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - easyesg-net

  redis:
    image: redis:8.10.0
    container_name: easyesg-redis
    restart: unless-stopped
    # architecture.md §12.5, OQ-21 — closed 18 Aug 2026: RDB snapshots on a volume, AOF off,
    # maxmemory-policy noeviction. Flags rather than a redis.conf because §10.7's tree names
    # no infra/redis/, and adding a directory to that tree is a documentation amendment.
    #
    # noeviction is the load-bearing setting, not the persistence choice (§12.5.8). BullMQ job
    # state is not a cache: under allkeys-lru Redis would silently discard queued work to stay
    # under maxmemory, and the loss would surface as reports that never rendered. Raise
    # maxmemory before you touch this policy.
    command:
      - redis-server
      - --save
      - "3600"
      - "1"
      - "300"
      - "100"
      - "60"
      - "10000"
      - --appendonly
      - "no"
      - --maxmemory
      - 2gb
      - --maxmemory-policy
      - noeviction
    ports:
      - 6379:6379
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - easyesg-net

  # The renderer (architecture.md §5, T-13; task 44.1): headless Chromium and the PDF finisher, the worker's one place to
  # print a report. Built from `apps/renderer/Dockerfile` — the image a deploy runs, never a development variant — and
  # held to a hard memory limit with a restart policy, so a render that eats its memory dies alone and comes back.
  renderer:
    build:
      context: ../..
      dockerfile: apps/renderer/Dockerfile
    image: easyesg-renderer:dev
    container_name: easyesg-renderer
    restart: unless-stopped
    # An init process is PID 1, not the renderer (§12.5.10's reason for postgres). A render killed at its deadline takes
    # Chromium's whole process tree with it, and whatever is orphaned is reparented to PID 1 — which Node never reaps.
    init: true
    # About 500 MB is what one render of a full report peaks at (measured on Chromium 151, task 44); the renderer runs
    # one at a time, and Chromium's shared memory gets room of its own rather than Docker's 64 MB default.
    mem_limit: 512m
    shm_size: 256m
    ports:
      - 3300:3000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - easyesg-net

  # Object storage for the exports' files (§5, §12.5.1; task 44.2): Versity's S3 gateway over a directory, standing in
  # for Scaleway, whose S3 API the worker speaks to both. Each top-level directory is a bucket, so `esg-exports` is made
  # before the gateway starts. Its root keys come from this directory's .env and are the worker's OBJECT_STORAGE_* keys.
  storage:
    image: versity/versitygw:v1.8.0
    container_name: easyesg-storage
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c", "mkdir -p /data/esg-exports && exec /usr/local/bin/versitygw posix /data"]
    environment:
      # Scaleway's region (§12.5.1), so a request is signed for the region production signs it for.
      VGW_REGION: fr-par
      ROOT_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:?set STORAGE_ACCESS_KEY in infra/compose/.env}
      ROOT_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:?set STORAGE_SECRET_KEY in infra/compose/.env}
    ports:
      - 7070:7070
    volumes:
      - storagedata:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "7070"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - easyesg-net

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  storagedata:
    driver: local

networks:
  easyesg-net:
    driver: bridge
