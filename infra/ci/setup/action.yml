# Shared setup for every CI job (§12.5.4, §10.7).
#
# Workflow entrypoints must live in .github/workflows — GitHub reads them from nowhere else — so
# what lives here is the part that is genuinely shared. Two jobs use it today and task 18's image
# and BILLING_ENABLED=false jobs will use the same four steps, which is what keeps this an action
# rather than a directory filled to match a diagram.
#
# It assumes the repository is already checked out: a local composite action cannot run before the
# checkout that puts it on disk.
name: Set up the workspace
description: Node, pnpm and a frozen install, pinned to architecture.md §12.1

runs:
  using: composite
  steps:
    # Before setup-node, because setup-node's pnpm cache needs pnpm on PATH to locate the store.
    #
    # The version is §12.1's pin. It is stated here as well as in the root package.json because
    # pnpm/action-setup reads `packageManager`, and this repository declares
    # `devEngines.packageManager` instead — pnpm 11 honours both, the action does not.
    - name: Install pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 11.22.0

    # engines.node is 26.7.0 and `engineStrict: true` is set in pnpm-workspace.yaml, so a version
    # that drifts from §12.1 fails the install below rather than passing quietly — which is the
    # point of the time-boxed Node 26 exception's second control (§12.6): laptops, Docker and CI all
    # run the same patch.
    - name: Install Node
      uses: actions/setup-node@v7
      with:
        node-version: 26.7.0
        cache: pnpm

    # --frozen-lockfile is the CI half of the lockfile contract: an install that would change
    # pnpm-lock.yaml fails instead of silently resolving something else. `strictDepBuilds` makes an
    # unreviewed dependency build script fail here too, rather than being skipped and surfacing at
    # runtime — which is what CLAUDE.md installed it for.
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
