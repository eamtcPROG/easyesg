# /etc/nginx/sites-available/easyesg-staging   (bootstrap — HTTP only)
#
# Used once, to issue the certificate with `certbot certonly --webroot`, and replaced by easyesg-staging.conf as soon as
# the certificate exists: the full file names certificate paths nginx refuses to load before they do. The host's nginx
# is the edge for every tenant on it (architecture.md §10.5), so the vhost is ours and the certificate is the host's.
#
# The names are proxied by Cloudflare, and plain HTTP reaches this host through it, which is what lets the webroot
# challenge pass without touching DNS:
#
#   sudo ln -sf ~/easyesg-deploy/infra/staging/nginx/easyesg-staging-bootstrap.conf /etc/nginx/sites-available/easyesg-staging
#   sudo ln -sf /etc/nginx/sites-available/easyesg-staging /etc/nginx/sites-enabled/easyesg-staging
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot certonly --webroot -w /var/www/letsencrypt \
#     -d staging.easyesg.md -d api-staging.easyesg.md -d admin-staging.easyesg.md

server {
    listen      80;
    listen      [::]:80;
    server_name staging.easyesg.md api-staging.easyesg.md admin-staging.easyesg.md;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
