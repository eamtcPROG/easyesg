# /etc/nginx/sites-available/easyesg-staging   (staging — architecture.md §10.5)
#
# The host's nginx is the edge for every tenant on it, so this stack publishes nothing public: the three services bind
# 127.0.0.1 (infra/compose/docker-compose.staging.yml) and this file is the only route to them. Its conventions — the
# upstreams with keepalive, the bootstrap/full split, the header block — are the ones the host's other vhosts use, so
# the box stays legible to whoever administers it.
#
# Installed by symlink so it stays under version control rather than becoming hand-edited server state, and so a deploy
# that moves the checkout moves this file with it (a reload is still a person's act):
#
#   sudo ln -sf ~/easyesg-deploy/infra/staging/nginx/easyesg-staging.conf /etc/nginx/sites-available/easyesg-staging
#   sudo nginx -t && sudo systemctl reload nginx
#
# **No §12.5.6 rate limits here yet.** They are task 71.1's, and staging admits what the application's own throttles
# admit until then.

upstream easyesg_staging_web {
    server 127.0.0.1:18102;
    keepalive 32;
}

upstream easyesg_staging_api {
    server 127.0.0.1:18101;
    keepalive 32;
}

upstream easyesg_staging_admin {
    server 127.0.0.1:18103;
    keepalive 32;
}

# Bare HTTP to HTTPS, and certificate renewals.
server {
    listen      80;
    listen      [::]:80;
    server_name staging.easyesg.md api-staging.easyesg.md admin-staging.easyesg.md;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- apps/web: the tenant application and the public pages -------------------------------------------------------
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name staging.easyesg.md;

    # One certificate for the three names, stored under the first one certbot was given.
    ssl_certificate     /etc/letsencrypt/live/staging.easyesg.md/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.easyesg.md/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    client_max_body_size 25m;

    location / {
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_pass         http://easyesg_staging_web;
    }
}

# --- apps/api: the public API and AD-15's socket ------------------------------------------------------------------
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name api-staging.easyesg.md;

    ssl_certificate     /etc/letsencrypt/live/staging.easyesg.md/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.easyesg.md/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    client_max_body_size 25m;

    location / {
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_pass         http://easyesg_staging_api;
    }

    # The socket (task 147) is the one route that upgrades, so it is the one place the upgrade headers are passed. The
    # api judges the Origin and the ticket on the upgrade itself; a long read timeout keeps an idle socket open between
    # the server's heartbeats.
    location = /api/v1/socket {
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_pass         http://easyesg_staging_api;
    }

    # Polled from outside by the deploy workflow; logging it would bury the real traffic.
    location = /health {
        access_log off;
        proxy_pass http://easyesg_staging_api;
    }
}

# --- apps/admin: the console, a static bundle -------------------------------------------------------------------
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name admin-staging.easyesg.md;

    ssl_certificate     /etc/letsencrypt/live/staging.easyesg.md/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.easyesg.md/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # The console uploads nothing; its requests go to the api's own host.
    client_max_body_size 1m;

    location / {
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_pass         http://easyesg_staging_admin;
    }
}
